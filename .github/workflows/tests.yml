name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    # Unit tests need no GPU, models, Elasticsearch, or Ollama: they run on
    # the light dependency set, and tests/test_imports.py guarantees the
    # tested modules never pull in torch/faiss at import time.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-core.txt

      - name: Install dependencies
        run: pip install -r requirements-core.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v
