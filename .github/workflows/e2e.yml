name: e2e

# Full "fresh clone -> docker compose up -> answer a question" check on a
# GitHub-hosted runner: CPU only, everything downloaded from scratch
# (Ollama + model, SciFact, retrieval models), indexes built from zero.
# Manual only — it takes about an hour, mostly the CPU SPLADE encoding.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Ollama model (small keeps CPU generation fast; quality is not under test)"
        default: "qwen2.5:0.5b-instruct"
      mode:
        description: "Pipeline to exercise"
        type: choice
        options: [agent, baseline]
        default: agent

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # Images + models + indexes need ~12 GB; the runner image ships
        # toolchains we don't use.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Configure .env like a new user would
        env:  # inputs via env, never interpolated into the script (injection-safe)
          MODEL: ${{ inputs.model }}
          MODE: ${{ inputs.mode }}
        run: |
          cp .env.example .env
          KEY=$(python3 -c "import secrets; print(secrets.token_urlsafe(32))")
          echo "::add-mask::$KEY"
          sed -i "s|^AGENTIC_RAG_API_KEYS=.*|AGENTIC_RAG_API_KEYS=$KEY|" .env
          sed -i "s|^LLM_MODEL=.*|LLM_MODEL=$MODEL|" .env
          cat >> .env <<EOF
          INDEXER_THREADS=4
          AGENTIC_RAG__AGENT__MODE=$MODE
          AGENTIC_RAG__LLM__READ_TIMEOUT_S=300
          AGENTIC_RAG__AGENT__REQUEST_TIMEOUT_S=600
          AGENTIC_RAG__SERVING__HARD_TIMEOUT_S=900
          EOF
          echo "KEY=$KEY" >> "$GITHUB_ENV"

      - name: docker compose up
        run: docker compose up -d --build

      - name: Wait for the API (model pull + index build)
        run: |
          start=$(date +%s)
          while true; do
            state=$(docker compose ps -a --format '{{.Service}}={{.State}}/{{.Health}}/{{.ExitCode}}' | tr '\n' ' ')
            case "$state" in
              *api=running/healthy*) echo "ready after $(( $(date +%s) - start ))s: $state"; break ;;
              *indexer=exited/*/[1-9]*|*ollama-pull=exited/*/[1-9]*) echo "::error::setup failed: $state"; exit 1 ;;
            esac
            if [ $(( $(date +%s) - start )) -gt 9000 ]; then echo "::error::timed out: $state"; exit 1; fi
            sleep 30
          done
          docker compose logs indexer | grep -E "corpus|built|present|ready in" || true

      - name: Smoke-test the running API
        run: python3 scripts/smoke_api.py --key "$KEY" --timeout 900

      - name: Resource usage
        if: always()
        run: |
          docker stats --no-stream || true
          docker system df || true

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
